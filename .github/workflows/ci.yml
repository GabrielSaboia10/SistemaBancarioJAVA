name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    # Redis de verdade para o teste do rate limit distribuído (RateLimiterRedisTest)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes
        # chmod: commits feitos no Windows podem não guardar a permissão de execução do mvnw
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build de produção
        run: npx ng build

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens do docker-compose
        env:
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci
          JWT_SECRET: segredo-apenas-para-o-build-do-ci-000000
          ADMIN_CPF: 000.000.000-00
          ADMIN_SENHA: ci
        run: docker compose build
