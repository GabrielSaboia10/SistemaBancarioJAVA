spring.application.name=sistema-bancario-api
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutos=15
app.jwt.refresh-token-dias=7
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
app.admin.cpf=${ADMIN_CPF:}
app.admin.senha=${ADMIN_SENHA:}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health

spring.data.web.pageable.max-page-size=100

# Rate limit (janela fixa). armazenamento: memoria (uma instância) ou redis (várias instâncias)
app.rate-limit.habilitado=true
app.rate-limit.armazenamento=${RATE_LIMIT_ARMAZENAMENTO:memoria}
# login + refresh, por IP
app.rate-limit.auth.limite=10
app.rate-limit.auth.janela=15m
# senhas erradas por CPF antes de bloquear aquele CPF
app.rate-limit.login-cpf.limite=5
app.rate-limit.login-cpf.janela=15m
# depósito/saque/transferência, por usuário
app.rate-limit.operacoes.limite=30
app.rate-limit.operacoes.janela=1m
# demais rotas /api, por IP
app.rate-limit.geral.limite=300
app.rate-limit.geral.janela=15m

# Redis (só usado com app.rate-limit.armazenamento=redis). Timeout curto: se o Redis travar,
# o rate limit é ignorado em vez de segurar a requisição.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
management.health.redis.enabled=false
