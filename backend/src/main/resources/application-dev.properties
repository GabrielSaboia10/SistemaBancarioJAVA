# Perfil de desenvolvimento: banco H2 em arquivo (./data), sem precisar instalar PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/bancodb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

app.jwt.secret=${JWT_SECRET:dev-secret-nao-use-em-producao-0123456789abcdef}
app.admin.cpf=${ADMIN_CPF:000.000.000-00}
app.admin.senha=${ADMIN_SENHA:admin123}
