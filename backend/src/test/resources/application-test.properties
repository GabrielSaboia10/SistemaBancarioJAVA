# Banco H2 em memória, um por contexto de teste
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.jwt.secret=segredo-de-teste-com-pelo-menos-32-caracteres
app.admin.cpf=000.000.000-00
app.admin.senha=admin123

# Limites altos para não interferir nos testes funcionais (RateLimitTest usa limites próprios)
app.rate-limit.auth.limite=1000
app.rate-limit.login-cpf.limite=1000
app.rate-limit.operacoes.limite=1000
app.rate-limit.geral.limite=10000
