<div class="tela">
  <div class="caixa">
    <div class="marca">Sistema Bancário</div>

    <div class="card">
      <h1>Acessar conta</h1>

      <form class="form" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input id="cpf" formControlName="cpf" inputmode="numeric" autocomplete="username"
                 placeholder="000.000.000-00" (input)="aoDigitarCpf($event)" />
          @if (form.controls.cpf.touched && form.controls.cpf.invalid) {
            <span class="erro-campo">Informe um CPF com 11 dígitos</span>
          }
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" formControlName="senha" autocomplete="current-password" />
          @if (form.controls.senha.touched && form.controls.senha.invalid) {
            <span class="erro-campo">Informe a senha</span>
          }
        </div>

        @if (erro()) {
          <div class="alerta erro" role="alert">{{ erro() }}</div>
        }

        <button type="submit" class="btn bloco" [disabled]="enviando()">
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>

    <p class="muted rodape">Esqueceu a senha? Procure sua agência.</p>
  </div>
</div>
