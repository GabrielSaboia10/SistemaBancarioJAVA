# Cache por arquivo. Só .js/.css têm hash no nome (mudam de nome a cada build) e podem ficar em cache.
# O service worker e o index.html nunca vão para cache, senão o app instalado não atualiza.
map $uri $cache_control {
    /ngsw-worker.js          "no-cache";
    /safety-worker.js        "no-cache";
    ~^/api/                  "";  # a API já manda Cache-Control: no-store (valor vazio = header não é adicionado)
    ~*\.(js|css)$            "public, max-age=31536000, immutable";
    default                  "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Declarados só aqui (nenhum location usa add_header), então valem para todas as respostas
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API no mesmo domínio do front: não precisa de CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do Angular caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
